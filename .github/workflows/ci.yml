name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      # Each CRE workflow is its own package with the Chainlink SDK.
      - run: |
          for dir in cre/*/; do
            if [ -f "$dir/package.json" ]; then (cd "$dir" && bun install); fi
          done
      - run: bun run typecheck
      - run: bun test
      - name: Audit the recorded live run (offline)
        run: bun run verify --snapshot shared/test/fixtures/ledger-snapshot.json
      - run: bun run dashboard:build
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: cd contracts && forge test
